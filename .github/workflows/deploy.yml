name: Deploy

# Manual (workflow_dispatch) até a VM existir e os secrets estarem cadastrados.
# Depois do primeiro deploy bem-sucedido, adicione o gatilho automático:
#   on:
#     workflow_dispatch:
#     push:
#       branches: [master]
# Secrets necessários: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# (ver docs/deploy-oracle.md).
on:
  workflow_dispatch:

jobs:
  build-and-push:
    # A arquitetura aqui TEM que bater com a da VM, senão o container morre na
    # hora com "exec format error". Hoje a VM é uma E2.1.Micro (amd64), porque
    # a Ampere/aarch64 do Always Free segue sem capacidade em sa-saopaulo-1.
    # Se um dia a Ampere sair (infra/oracle, enable_ampere), é só voltar isto
    # pra `ubuntu-24.04-arm` + `linux/arm64` — ambos são runners nativos e
    # gratuitos em repositório público.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O GHCR só aceita nome de repositório em minúsculas, mas o login do
      # GitHub pode ter maiúsculas (MeloJu). Usar github.repository_owner cru
      # faz o buildx falhar com "repository name must be lowercase".
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/animebattler" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Roda a imagem recém-publicada, nativamente, neste runner. É o artefato
      # exato que vai pra VM — não um primo de outra arquitetura. Se falhar
      # aqui, o job `deploy` nem começa e a VM não é tocada.
      - name: Smoke test the image
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          bash scripts/smoke-test.sh ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mantém compose e Caddyfile da VM em sincronia com o repo. Antes isso
      # era um scp manual feito uma vez, que ia silenciosamente ficando velho a
      # cada mudança no repositório.
      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "~/animebattler"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            cd ~/animebattler

            # A imagem no GHCR nasce privada, então a VM precisa autenticar pra
            # dar pull. Este token vale só enquanto este job roda — melhor que
            # deixar um PAT permanente guardado na VM.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Fixa a imagem no SHA do commit em vez de :latest — dá pra saber
            # exatamente o que está no ar, e rollback vira só rodar o workflow
            # de novo a partir de outro commit.
            export IMAGE_TAG

            # Grava a versão implantada no .env da VM.
            #
            # Sem isto, o `${IMAGE_TAG:-latest}` do compose faz qualquer
            # `docker compose up` rodado à mão na VM cair no `latest` — e o
            # `latest` local nunca é atualizado, porque o pull acima só baixa a
            # tag do SHA. O resultado é produção voltar em silêncio para a
            # primeira imagem já baixada, sem erro nenhum no caminho.
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Deploy só termina quando o healthcheck passa de verdade. Sem isso
            # o job ficava verde mesmo com o container em loop de restart.
            echo "Aguardando o app ficar healthy..."
            for i in $(seq 1 40); do
              cid=$(docker compose -f docker-compose.prod.yml ps -q app)
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "✔ app healthy ($IMAGE_TAG)"
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "✖ app não ficou healthy. Últimos logs:"
                docker compose -f docker-compose.prod.yml logs --tail=80 app
                exit 1
              fi
              sleep 5
            done

            # Catálogo entra DEPOIS do app estar healthy, e não antes: ele fala
            # com o banco pelo container do app, que só existe quando o
            # `prisma migrate deploy` do CMD já terminou. Rodar antes pegaria o
            # schema velho.
            #
            # Era o único passo manual que sobrava no deploy — subir a imagem
            # publicava o CÓDIGO novo mas deixava o CONTEÚDO velho, então
            # personagem, arco de história e habilidade novos simplesmente não
            # apareciam, sem erro nenhum no caminho.
            #
            # É idempotente e não toca em tabela de jogador: rodar duas vezes
            # seguidas imprime "catálogo já está em dia" na segunda.
            echo "Sincronizando catálogo..."
            docker compose -f docker-compose.prod.yml exec -T app npm run catalog:sync

            # Imagens antigas acumulam a cada deploy e enchem o disco da VM.
            docker image prune -f
