name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animebattler
          POSTGRES_PASSWORD: animebattler
          POSTGRES_DB: animebattler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animebattler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://animebattler:animebattler@localhost:5432/animebattler?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Job separado porque o `npm run build` acima passava mesmo com o Dockerfile
  # quebrado — a imagem nunca era construída no CI, e o erro só apareceria no
  # deploy. Aqui ela é construída de verdade (sem push) a cada PR.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build nativo amd64 só pra validar que o Dockerfile funciona. O deploy
      # builda arm64 de verdade, num runner ARM — ver deploy.yml.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
